<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
  <title>Бот — компаньон</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-title">
        <div class="brand-mark" aria-hidden="true">B</div>
        <div class="header-copy">
          <h1 data-i18n="headerTitle">Бот — компаньон</h1>
          <p data-i18n="headerSubtitle">Данные чата и его настройки</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="language-field">
          <label class="language-label" for="language" data-i18n="languageLabel">Язык</label>
          <select id="language" class="language-select" data-i18n-aria="languageLabel" aria-label="Язык">
            <option value="ru">RU</option>
            <option value="en">EN</option>
          </select>
        </div>
        <button id="logout" class="secondary logout-button" type="button" data-i18n="closeSession" hidden>Закрыть сессию</button>
      </div>
    </div>
  </header>
  <main>
    <div id="error" role="alert" hidden></div>
    <div id="notice" role="status" hidden></div>
    <section id="launch" class="panel launch-panel">
      <span class="eyebrow" data-i18n="headerTitle">Бот — компаньон</span>
      <h2 data-i18n="launchTitle">Запуск из Telegram</h2>
      <p data-i18n="launchText">Откройте Mini App через «Ещё → Mini App» в меню бота. Ссылка запуска и подпись Telegram проверяются до показа данных чата.</p>
    </section>
    <div id="app" hidden>
      <nav id="tabs" class="tabs" role="tablist" data-i18n-aria="navLabel" aria-label="Разделы чата">
        <button id="tab-chat" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="chat">
          <span class="tab-label tab-label-full" data-i18n="tabChat">Чат</span>
          <span class="tab-label tab-label-short" data-i18n="tabChatShort">Чат</span>
        </button>
        <button id="tab-status" type="button" role="tab" aria-selected="true" aria-controls="content" tabindex="0" data-tab="status" class="active">
          <span class="tab-label tab-label-full" data-i18n="tabStatus">Статус</span>
          <span class="tab-label tab-label-short" data-i18n="tabStatusShort">Статус</span>
        </button>
        <button id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="history">
          <span class="tab-label tab-label-full" data-i18n="tabHistory">История</span>
          <span class="tab-label tab-label-short" data-i18n="tabHistoryShort">История</span>
        </button>
        <button id="tab-documents" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="documents">
          <span class="tab-label tab-label-full" data-i18n="tabDocuments">Документы</span>
          <span class="tab-label tab-label-short" data-i18n="tabDocumentsShort">Докум.</span>
        </button>
        <button id="tab-links" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="links">
          <span class="tab-label tab-label-full" data-i18n="tabLinks">Ссылки</span>
          <span class="tab-label tab-label-short" data-i18n="tabLinksShort">Ссылки</span>
        </button>
        <button id="tab-tasks" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="tasks">
          <span class="tab-label tab-label-full" data-i18n="tabTasks">Задачи</span>
          <span class="tab-label tab-label-short" data-i18n="tabTasksShort">Задачи</span>
        </button>
        <button id="tab-reminders" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="reminders">
          <span class="tab-label tab-label-full" data-i18n="tabReminders">Напоминания</span>
          <span class="tab-label tab-label-short" data-i18n="tabRemindersShort">Напом.</span>
        </button>
        <button id="tab-usage" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="usage">
          <span class="tab-label tab-label-full" data-i18n="tabUsage">Использование</span>
          <span class="tab-label tab-label-short" data-i18n="tabUsageShort">Использ.</span>
        </button>
        <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="content" tabindex="-1" data-tab="settings">
          <span class="tab-label tab-label-full" data-i18n="tabSettings">Настройки</span>
          <span class="tab-label tab-label-short" data-i18n="tabSettingsShort">Настр.</span>
        </button>
      </nav>
      <section class="panel workspace-panel" aria-labelledby="section-title">
        <div class="section-heading">
          <div class="section-heading-copy">
            <span class="eyebrow" data-i18n="headerSubtitle">Данные чата и его настройки</span>
            <h2 id="section-title">Статус</h2>
          </div>
          <button id="refresh" class="secondary refresh-button" type="button" data-i18n="refresh">Обновить</button>
        </div>
        <div id="loading" class="loading" role="status" data-i18n="loading" hidden>Загрузка…</div>
        <div id="content" aria-live="polite" aria-busy="false"></div>
        <button id="more" class="load-more" type="button" data-i18n="loadOlder" hidden>Показать ранее</button>
      </section>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
