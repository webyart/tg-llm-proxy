name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Lint, unit, maintenance, integration and build
        shell: pwsh
        run: ./scripts/verify.ps1 -SkipRace -SkipHealth
        env:
          CGO_ENABLED: '0'

  docker-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go vet and race tests, including integration
        shell: pwsh
        run: ./scripts/test-race.ps1 -Tagged
