# docker-compose.yml — §8.1: the bot service with a named volume for SQLite, env_file, and the
# detached `test` profile of §9 (`docker compose --profile test run --rm test`).
#
# /data is a NAMED volume, never a Windows bind-mount: §8.1 measures that a 9p/virtiofs mount of a
# Windows directory under WAL risks a corrupt database, and store.Open writes bot.db through the
# whitelist DSN of §5 that assumes a real Linux filesystem.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: run
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-dev}
    image: tg-llm-proxy-bot:latest
    # Whisper is OPTIONAL for the text bot: it has no depends_on, so a dead or still-downloading transcriber
    # cannot block polling. Voice is degraded, not fatal — the voice handler answers with a localized
    # RU/EN error and the text path keeps working (see README, «Whisper не обязателен для старта»).
    # The whisper service, its healthcheck and the edge-gateway WhisperDown alert stay as they are.
    # §8.1: the §7 table comes from .env, compose pins the container path of the database.
    env_file:
      - path: .env
        # §14.1: the Telegram token is still an open question, so `docker compose up` must not fail
        # with «no .env file» while the placeholder of §10 День 5 is in use.
        required: false
      # Optional non-secret network overrides (HTTPS_PROXY/NO_PROXY), persistent across scheduled restarts.
      - path: data/telegram-proxy.env
        required: false
    environment:
      DB_PATH: /data/bot.db
      # Docker secrets: the values arrive through files mounted at /run/secrets/<name> and are read by
      # internal/config's *_FILE loader. The empty TELEGRAM_BOT_TOKEN/STRATA_API_KEY rows are DELIBERATE:
      # they override the plain values that env_file would otherwise copy from .env, because the loader
      # refuses to see both ENV and its _FILE spelling. No secret value is present in this file's environment.
      # `docker compose config` therefore shows the paths, never the tokens.
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      STRATA_API_KEY: ""
      STRATA_API_KEY_FILE: /run/secrets/strata_api_key
      # §7/§8.1: inside the container 127.0.0.1 is the container's OWN loopback, so the .env value that is
      # right for scripts/run.ps1 on Windows (http://127.0.0.1:8080/v1) would make the bot call its own
      # /healthz port and every /ask would fail. The host is reachable under host.docker.internal
      # (extra_hosts below, §14 item 7), and `environment` wins over `env_file` — the same reason DB_PATH is
      # pinned here. Override from the shell or from .env with STRATA_BASE_URL_CONTAINER, which compose
      # resolves while parsing this file and never passes into the container (the process still sees exactly
      # the 29 names of §7, §16 change 29).
      STRATA_BASE_URL: ${STRATA_BASE_URL_CONTAINER:-http://host.docker.internal:8080/v1}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL_CONTAINER:-http://whisper:8000}
      STRATA_TRANSCRIPTION_MODEL: ${STRATA_TRANSCRIPTION_MODEL_CONTAINER:-Systran/faster-whisper-small}
      NO_PROXY: 127.0.0.1,localhost,host.docker.internal,whisper
      no_proxy: 127.0.0.1,localhost,host.docker.internal,whisper
      # §7: HEALTH_PORT is the in-container METRICS port (Prometheus scrapes bot:${HEALTH_PORT}) and the
      # HOST port of the published health URL. The health probe itself listens on HEALTH_PROBE_PORT, so the
      # two ports differ and metrics can bind a single interface without colliding with 0.0.0.0.
      HEALTH_PORT: ${HEALTH_PORT:-8081}
      # The /healthz and /readyz listener. It stays on 0.0.0.0: the Docker HEALTHCHECK probes 127.0.0.1 and
      # the host publish reaches the container interface; this listener has no /metrics.
      HEALTH_PROBE_PORT: ${HEALTH_PROBE_PORT:-8080}
      # The health listener binds all interfaces of the CONTAINER: the HEALTHCHECK probes 127.0.0.1, and the
      # host publish below targets the container's default-network address. It serves only /healthz,/readyz.
      HEALTH_LISTEN_HOST: 0.0.0.0
      # Where /metrics binds. This is a CONCRETE address on the edge-monitoring network (the bot's static IP
      # there), never 0.0.0.0: containers on default, edge-telegram, whisper or searxng have no route to it.
      # METRICS_LISTEN_HOST_CONTAINER is compose-only; METRICS_LISTEN_HOST is the process row.
      METRICS_LISTEN_HOST: ${METRICS_LISTEN_HOST_CONTAINER:-172.24.0.250}
      WEBHOOK_LISTEN_HOST: ${WEBHOOK_LISTEN_HOST_CONTAINER:-0.0.0.0}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8082}
      MINIAPP_LISTEN_HOST: ${MINIAPP_LISTEN_HOST_CONTAINER:-0.0.0.0}
      MINIAPP_PORT: ${MINIAPP_PORT:-8084}
    # §9 scripts/smoke.ps1 and the DoD of §10 День 5 probe «GET http://localhost:8080/healthz у запущенного
    # контейнера» — that is a probe from the HOST. The host side is 127.0.0.1:${HEALTH_PORT} (the URL operators
    # and scripts already use), forwarded to the in-container health listener HEALTH_PROBE_PORT. /metrics is
    # deliberately NOT published: the only route to it is the edge-monitoring network (see networks below).
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8081}:${HEALTH_PROBE_PORT:-8080}"
      - "127.0.0.1:${WEBHOOK_HOST_PORT:-8082}:${WEBHOOK_PORT:-8082}"
      - "127.0.0.1:${MINIAPP_HOST_PORT:-8084}:${MINIAPP_PORT:-8084}"
    # Local Docker secrets, created from .env by scripts/setup_docker_secrets.ps1 (or the .sh twin).
    # The two files are gitignored and dockerignored; only their paths reach the container.
    secrets:
      - source: telegram_bot_token
        target: /run/secrets/telegram_bot_token
      - source: strata_api_key
        target: /run/secrets/strata_api_key
    volumes:
      - bot-data:/data
    read_only: true
    mem_limit: 512MiB
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # `unless-stopped` on purpose, not `on-failure:N`: a chat bot must come back from a transient outage by
    # itself, and a configuration error already fails in under a second with the row named. A persistent crash
    # loop is caught by scripts/watch_container.ps1 (alert, no auto-restart), not by giving up on the service —
    # see docs/adr/0006-restart-policy.md.
    restart: unless-stopped
    # §8.1/§12: the shutdown budget measured on this host is ~11 s (Telegram long-poll drain + SQLite close).
    # Docker's default stop grace period is 10 s, so `docker compose stop` killed the bot just before its clean
    # close and could leave committed-but-uncheckpointed frames only in bot.db-wal. 60 s leaves headroom for a
    # slow disk or a busy model call while still bounding a hung shutdown; db_volume_maintenance verifies that
    # the container really reached `exited` before it copies /data.
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    # §8.1: a local STRATA/Ollama on the Windows host is reachable under this name (§14 item 7).
    extra_hosts:
      - host.docker.internal:host-gateway
    # The image already carries HEALTHCHECK (§8.1); compose surfaces its state in `docker ps`.
    # Metrics isolation: edge-monitoring is the edge-gateway project's network. Prometheus is already
    # attached to it, so bot:8081 resolves there and the scrape stays green. The static address is the one
    # METRICS_LISTEN_HOST binds; containers on default / edge-telegram / whisper / searxng are not on this
    # network and cannot open the metrics socket. If the gateway recreates the network with another subnet,
    # set METRICS_LISTEN_HOST_CONTAINER in .env to a free address of that subnet (both rows follow it).
    networks:
      default:
      edge-telegram:
        aliases:
          - telegram-miniapp
      edge-monitoring:
        ipv4_address: ${METRICS_LISTEN_HOST_CONTAINER:-172.24.0.250}

  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    environment:
      ENABLE_UI: "false"
      HF_HUB_DISABLE_XET: "1"
      LOG_LEVEL: info
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
      STT_MODEL_TTL: "-1"
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    read_only: true
    mem_limit: 4GiB
    cpus: 4.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: tg-llm-proxy-test:latest
    # No volume: the sources are baked into the test image, so nothing of the Windows tree is
    # mounted into the race run (§8.1, same 9p/WAL reason as /data above).
    environment:
      GOMAXPROCS: "4"

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  strata_api_key:
    file: ./secrets/strata_api_key

networks:
  default:
  edge-telegram:
    external: true
  # Owned by the edge-gateway Compose project (name: edge-gateway, network key: edge-monitoring). The bot
  # joins it only for the metrics listener; Prometheus is the only intended scraper on it.
  edge-monitoring:
    external: true
    name: edge-gateway_edge-monitoring

volumes:
  bot-data:
  whisper-models:
